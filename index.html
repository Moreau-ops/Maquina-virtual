<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador de Máquina Virtual</title>
  <style>
    :root {
      --bg-color: #1a1a24;
      --card-bg: #242438;
      --accent: #6c5ce7;
      --accent-hover: #5a4bcf;
      --text: #e0e0e0;
      --text-dim: #a0a0b0;
      --success: #00b894;
      --danger: #d63031;
      --terminal-bg: #0f0f18;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .vm-container {
      background-color: var(--card-bg);
      border-radius: 12px;
      width: 100%;
      max-width: 800px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      overflow: hidden;
      border: 1px solid #33334d;
    }

    .vm-header {
      background-color: #14141f;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #33334d;
    }

    .vm-title {
      font-weight: bold;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-indicator {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: var(--danger);
      box-shadow: 0 0 8px var(--danger);
      transition: all 0.3s ease;
    }

    .status-indicator.online {
      background-color: var(--success);
      box-shadow: 0 0 8px var(--success);
    }

    .controls button {
      background-color: var(--accent);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }

    .controls button:hover {
      background-color: var(--accent-hover);
    }

    .controls button.off {
      background-color: var(--danger);
    }

    .vm-body {
      padding: 20px;
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 20px;
    }

    .specs-panel {
      background-color: #1c1c2b;
      padding: 15px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .spec-item {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .spec-label {
      font-size: 0.85rem;
      color: var(--text-dim);
    }

    .progress-bar {
      width: 100%;
      height: 8px;
      background-color: #2d2d42;
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background-color: var(--accent);
      transition: width 0.3s ease;
    }

    .screen-panel {
      background-color: var(--terminal-bg);
      border-radius: 8px;
      padding: 15px;
      font-family: 'Courier New', Courier, monospace;
      height: 320px;
      display: flex;
      flex-direction: column;
      border: 1px solid #2a2a3d;
    }

    .terminal-output {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 0.9rem;
    }

    .line {
      word-break: break-all;
    }

    .line.system { color: #7f8c8d; }
    .line.success { color: var(--success); }
    .line.error { color: var(--danger); }

    .terminal-input-line {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .prompt {
      color: var(--accent);
      font-weight: bold;
    }

    .terminal-input {
      background: transparent;
      border: none;
      color: var(--text);
      font-family: inherit;
      font-size: 0.9rem;
      flex: 1;
      outline: none;
    }
  </style>
</head>
<body>

  <div class="vm-container">
    <div class="vm-header">
      <div class="vm-title">
        <div class="status-indicator" id="statusIndicator"></div>
        <span>Ubuntu_22.04_LTS (Virtual)</span>
      </div>
      <div class="controls">
        <button id="powerBtn" onclick="togglePower()">Encender</button>
      </div>
    </div>

    <div class="vm-body">
      <div class="specs-panel">
        <div class="spec-item">
          <span class="spec-label">Estado del Sistema</span>
          <strong id="statusText">Apagado</strong>
        </div>
        <div class="spec-item">
          <span class="spec-label">Uso de CPU</span>
          <div class="progress-bar"><div class="progress-fill" id="cpuUsage"></div></div>
        </div>
        <div class="spec-item">
          <span class="spec-label">Memoria RAM (2GB / 4GB)</span>
          <div class="progress-bar"><div class="progress-fill" id="ramUsage"></div></div>
        </div>
        <div class="spec-item">
          <span class="spec-label">Disco Virtual (20GB / 50GB)</span>
          <div class="progress-bar"><div class="progress-fill" style="width: 40%;"></div></div>
        </div>
      </div>

      <div class="screen-panel">
        <div class="terminal-output" id="terminal">
          <div class="line system">Sistema apagado. Presiona "Encender" para iniciar.</div>
        </div>
        <div class="terminal-input-line" id="inputLine" style="display: none;">
          <span class="prompt">user@virtual-vm:~$</span>
          <input type="text" class="terminal-input" id="cmdInput" autofocus>
        </div>
      </div>
    </div>
  </div>

  <script>
    let isPoweredOn = false;
    let cpuInterval = null;

    const powerBtn = document.getElementById('powerBtn');
    const statusIndicator = document.getElementById('statusIndicator');
    const statusText = document.getElementById('statusText');
    const terminal = document.getElementById('terminal');
    const inputLine = document.getElementById('inputLine');
    const cmdInput = document.getElementById('cmdInput');
    const cpuUsage = document.getElementById('cpuUsage');
    const ramUsage = document.getElementById('ramUsage');

    function togglePower() {
      if (!isPoweredOn) {
        bootVM();
      } else {
        shutdownVM();
      }
    }

    function bootVM() {
      isPoweredOn = true;
      powerBtn.textContent = "Apagar";
      powerBtn.classList.add('off');
      statusIndicator.classList.add('online');
      statusText.textContent = "Iniciando...";
      terminal.innerHTML = "";

      printLine("Iniciando BIOS virtual...", "system");

      setTimeout(() => printLine("Cargando Kernel de Linux...", "system"), 600);
      setTimeout(() => printLine("Montando sistemas de archivos...", "system"), 1200);
      setTimeout(() => printLine("Red configurada. IP: 192.168.1.50", "success"), 1800);
      setTimeout(() => {
        printLine("Sistema iniciado con éxito. Escribe 'help' para ver los comandos.", "success");
        statusText.textContent = "En Ejecución";
        inputLine.style.display = "flex";
        cmdInput.focus();
        startResourceMonitor();
      }, 2500);
    }

    function shutdownVM() {
      isPoweredOn = false;
      powerBtn.textContent = "Encender";
      powerBtn.classList.remove('off');
      statusIndicator.classList.remove('online');
      statusText.textContent = "Apagado";
      inputLine.style.display = "none";
      clearInterval(cpuInterval);
      
      cpuUsage.style.width = "0%";
      ramUsage.style.width = "0%";

      printLine("Enviando señal SIGTERM a todos los procesos...", "system");
      setTimeout(() => printLine("Sistema detenido. Apagando...", "system"), 500);
      setTimeout(() => {
        terminal.innerHTML = '<div class="line system">Sistema apagado. Presiona "Encender" para iniciar.</div>';
      }, 1200);
    }

    function printLine(text, type = "") {
      const line = document.createElement('div');
      line.className = `line ${type}`;
      line.textContent = text;
      terminal.appendChild(line);
      terminal.scrollTop = terminal.scrollHeight;
    }

    function startResourceMonitor() {
      ramUsage.style.width = "45%";
      cpuInterval = setInterval(() => {
        if (isPoweredOn) {
          const randomCpu = Math.floor(Math.random() * 30) + 5;
          cpuUsage.style.width = `${randomCpu}%`;
        }
      }, 1500);
    }

    cmdInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const command = cmdInput.value.trim();
        if (command !== "") {
          printLine(`user@virtual-vm:~$ ${command}`);
          processCommand(command.toLowerCase());
          cmdInput.value = "";
        }
      }
    });

    function processCommand(cmd) {
      const args = cmd.split(' ');
      
      switch (args[0]) {
        case 'help':
          printLine("Comandos disponibles:", "system");
          printLine("  help     - Muestra esta lista de comandos");
          printLine("  clear    - Limpia la pantalla de la terminal");
          printLine("  date     - Muestra la fecha y hora actual");
          printLine("  whoami   - Muestra el usuario actual");
          printLine("  ping     - Simula un ping de red (ej: ping google.com)");
          printLine("  echo     - Imprime un texto en pantalla");
          break;

        case 'clear':
          terminal.innerHTML = "";
          break;

        case 'date':
          printLine(new Date().toString());
          break;

        case 'whoami':
          printLine("user");
          break;

        case 'echo':
          printLine(args.slice(1).join(' '));
          break;

        case 'ping':
          const host = args[1] || "localhost";
          printLine(`Haciendo ping a ${host} [142.250.190.46] con 32 bytes de datos:`);
          setTimeout(() => printLine(`Respuesta desde ${host}: bytes=32 tiempo=12ms TTL=117`), 400);
          setTimeout(() => printLine(`Respuesta desde ${host}: bytes=32 tiempo=10ms TTL=117`), 800);
          break;

        default:
          printLine(`Comando no encontrado: ${cmd}. Escribe 'help' para obtener ayuda.`, "error");
          break;
      }
    }
  </script>
</body>
</html>
